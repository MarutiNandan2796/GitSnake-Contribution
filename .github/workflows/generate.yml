name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *" # Run every day at midnight
  workflow_dispatch:   # Run manually
  push:
    branches:
      - main
      - master

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Snake Assets
        run: |
          npm run generate -- --user ${{ github.repository_owner }} --png
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Organize Output Assets
        run: |
          mkdir -p output-assets
          mv github-snake*.svg github-snake*.png output-assets/

      - name: Deploy Assets to Output Branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: output-assets
          keep_history: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
